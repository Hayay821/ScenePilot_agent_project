<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BoldMaker</title>
    <style>
      :root {
        --home-ink: #20252b;
        --home-line: #e1e3e1;
        --home-paper: #f8f8f5;
        --home-muted: #7b8284;
        --home-accent: #de6943;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        color: var(--home-ink);
        background: var(--home-paper);
        font-family: 'Microsoft YaHei', sans-serif;
      }

      .top-navigation {
        display: grid;
        width: 100%;
        height: 58px;
        grid-template-columns: repeat(4, 1fr);
        border-bottom: 1px solid var(--home-line);
        background: rgba(255, 255, 255, 0.72);
      }

      .top-navigation span {
        display: grid;
        min-width: 0;
        place-items: center;
        color: #60676a;
        text-decoration: none;
        font-size: 13px;
        font-weight: 500;
      }

      .top-navigation a {
        display: grid;
        min-width: 0;
        place-items: center;
        color: #60676a;
        text-decoration: none;
        font-size: 13px;
        font-weight: 500;
      }

      .top-navigation .selected {
        color: var(--home-paper);
        background: var(--home-ink);
      }

      .skills-page {
        display: grid;
        min-height: calc(100vh - 58px);
        grid-template-columns: 170px minmax(0, 1fr);
      }

      .skills-sidebar {
        padding: 32px 18px;
        border-right: 1px solid var(--home-line);
        background: #f2f2ee;
      }

      .sidebar-label {
        margin: 0 12px 18px;
        color: #a0a6a6;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.16em;
      }

      .sidebar-option {
        display: block;
        width: 100%;
        margin-bottom: 6px;
        padding: 12px;
        border: 0;
        border-radius: 2px;
        color: #6b7375;
        background: transparent;
        cursor: pointer;
        font-family: inherit;
        font-size: 13px;
        text-align: left;
      }

      .sidebar-option.active,
      .sidebar-option:hover {
        color: var(--home-ink);
        background: #ffffff;
      }

      .skills-content {
        min-width: 0;
        padding: 42px clamp(24px, 5vw, 72px) 64px;
      }

      .skills-view {
        width: min(100%, 820px);
      }

      .skills-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 28px;
      }

      .skills-heading {
        margin: 0;
        font-size: 26px;
        font-weight: 600;
      }

      .skills-caption {
        margin: 9px 0 0;
        color: var(--home-muted);
        font-size: 13px;
      }

      .add-skill-button {
        flex: 0 0 auto;
        min-height: 40px;
        padding: 0 16px;
        border: 1px solid var(--home-ink);
        border-radius: 2px;
        color: var(--home-paper);
        background: var(--home-ink);
        cursor: pointer;
        font-family: inherit;
        font-size: 13px;
      }

      .skill-list {
        margin: 0;
        padding: 0;
        border: 1px solid var(--home-line);
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.64);
      }

      .skill-item {
        border-bottom: 1px solid var(--home-line);
      }

      .skill-item:last-child {
        border-bottom: 0;
      }

      .skill-row {
        display: flex;
        width: 100%;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 20px 22px;
        border: 0;
        color: var(--home-ink);
        background: transparent;
        cursor: pointer;
        font-family: inherit;
        text-align: left;
      }

      .skill-item-header {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
      }

      .skill-actions {
        display: flex;
        align-items: center;
        gap: 16px;
        padding-right: 22px;
      }

      .delete-skill-button {
        padding: 6px 0;
        border: 0;
        color: #bd5132;
        background: transparent;
        cursor: pointer;
        font-family: inherit;
        font-size: 12px;
      }

      .delete-skill-button:hover {
        color: var(--home-ink);
      }

      .public-toggle {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        color: var(--home-muted);
        cursor: pointer;
        font-size: 12px;
        white-space: nowrap;
      }

      .public-toggle input {
        width: 30px;
        height: 17px;
        margin: 0;
        appearance: none;
        border-radius: 10px;
        outline: none;
        background: #cdd1d0;
        cursor: pointer;
        transition: background 160ms ease;
      }

      .public-toggle input::after {
        display: block;
        width: 13px;
        height: 13px;
        margin: 2px;
        border-radius: 50%;
        background: #ffffff;
        content: '';
        transition: transform 160ms ease;
      }

      .public-toggle input:checked {
        background: var(--home-accent);
      }

      .public-toggle input:checked::after {
        transform: translateX(13px);
      }

      .skill-row:hover {
        background: #ffffff;
      }

      .skill-name {
        font-size: 14px;
        font-weight: 600;
      }

      .skill-type {
        margin-left: auto;
        color: #a0a6a6;
        font-size: 11px;
      }

      .skill-chevron {
        color: var(--home-muted);
        font-size: 16px;
      }

      .skill-description {
        display: none;
        margin: -4px 22px 20px;
        color: var(--home-muted);
        font-size: 13px;
        line-height: 1.7;
      }

      .skill-item.expanded .skill-description {
        display: block;
      }

      .empty-search {
        padding: 34px 22px;
        color: var(--home-muted);
        font-size: 13px;
        text-align: center;
      }

      .search-wrap {
        position: relative;
        margin-bottom: 18px;
      }

      .search-input {
        width: 100%;
        height: 46px;
        padding: 0 16px;
        border: 1px solid var(--home-line);
        border-radius: 2px;
        outline: none;
        color: var(--home-ink);
        background: #ffffff;
        font-family: inherit;
        font-size: 13px;
      }

      .search-input:focus {
        border-color: var(--home-accent);
        box-shadow: 0 0 0 3px rgba(222, 105, 67, 0.12);
      }

      .upload-dialog {
        width: min(90vw, 520px);
        padding: 0;
        border: 0;
        border-radius: 4px;
        color: var(--home-ink);
        background: var(--home-paper);
        box-shadow: 0 18px 60px rgba(32, 37, 43, 0.22);
      }

      .upload-dialog::backdrop {
        background: rgba(32, 37, 43, 0.42);
      }

      .upload-dialog-content {
        padding: 28px;
      }

      .dialog-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 22px;
      }

      .dialog-title {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
      }

      .dialog-caption {
        margin: 7px 0 0;
        color: var(--home-muted);
        font-size: 12px;
      }

      .close-dialog {
        width: 28px;
        height: 28px;
        padding: 0;
        border: 1px solid var(--home-line);
        border-radius: 50%;
        color: var(--home-muted);
        background: transparent;
        cursor: pointer;
        font-size: 18px;
        line-height: 1;
      }

      .skill-form {
        display: grid;
        gap: 16px;
      }

      .skill-field {
        display: grid;
        gap: 8px;
      }

      .skill-field label {
        color: #4d5558;
        font-size: 12px;
        font-weight: 600;
      }

      .skill-field input,
      .skill-field textarea {
        width: 100%;
        border: 1px solid var(--home-line);
        border-radius: 2px;
        outline: none;
        color: var(--home-ink);
        background: #ffffff;
        font-family: inherit;
        font-size: 13px;
      }

      .skill-field input {
        height: 42px;
        padding: 0 12px;
      }

      .skill-field textarea {
        min-height: 74px;
        padding: 10px 12px;
        resize: vertical;
      }

      .skill-field input:focus,
      .skill-field textarea:focus {
        border-color: var(--home-accent);
        box-shadow: 0 0 0 3px rgba(222, 105, 67, 0.12);
      }

      .skill-drop-zone {
        display: grid;
        min-height: 116px;
        place-items: center;
        border: 1px dashed #b9bfbe;
        border-radius: 2px;
        color: var(--home-muted);
        background: #ffffff;
        font-size: 13px;
        text-align: center;
      }

      .skill-drop-zone span {
        display: block;
        margin-top: 7px;
        color: #a2a8a8;
        font-size: 11px;
      }

      .dialog-confirm {
        min-height: 40px;
        margin-top: 4px;
        border: 0;
        border-radius: 2px;
        color: var(--home-paper);
        background: var(--home-ink);
        cursor: pointer;
        font-family: inherit;
        font-size: 13px;
      }

      @media (max-width: 480px) {
        .top-navigation {
          height: 52px;
        }

        .top-navigation span,
        .top-navigation a {
          font-size: 12px;
        }

        .skills-page {
          display: block;
          min-height: calc(100vh - 52px);
        }

        .skills-sidebar {
          display: grid;
          grid-template-columns: repeat(2, 1fr);
          gap: 8px;
          padding: 12px 18px;
          border-right: 0;
          border-bottom: 1px solid var(--home-line);
        }

        .sidebar-label {
          display: none;
        }

        .sidebar-option {
          margin: 0;
          text-align: center;
        }

        .skills-content {
          padding: 28px 18px 42px;
        }

        .skills-header {
          display: block;
        }

        .add-skill-button {
          margin-top: 20px;
        }

        .skill-row {
          padding: 18px;
        }

        .skill-item-header {
          display: block;
        }

        .skill-actions {
          justify-content: flex-end;
          padding: 0 18px 14px;
        }

        .skill-description {
          margin-right: 18px;
          margin-left: 18px;
        }

        .upload-dialog-content {
          padding: 22px;
        }
      }
    </style>
  </head>
  <body>
    <nav class="top-navigation" aria-label="主页面板选择">
      <a href="./home.html">仓库</a>
      <a href="./create.html">创作</a>
      <span class="selected" aria-current="page">skills</span>
      <a href="./settings.html">用户设置</a>
    </nav>

    <main class="skills-page">
      <aside class="skills-sidebar" aria-label="skills 页面选项">
        <p class="sidebar-label">SKILLS</p>
        <button id="my-skills-tab" class="sidebar-option active" type="button">我的</button>
        <button id="square-tab" class="sidebar-option" type="button">广场</button>
      </aside>

      <section class="skills-content">
        <div id="my-skills-view" class="skills-view">
          <header class="skills-header">
            <div>
              <h1 class="skills-heading">我的 Skills</h1>
              <p class="skills-caption">管理你创建和收藏的技能</p>
            </div>
            <button id="add-skill-button" class="add-skill-button" type="button">添加 Skill</button>
          </header>
          <div id="my-skill-list" class="skill-list" aria-label="我的 skills 列表"></div>
        </div>

        <div id="square-view" class="skills-view" hidden>
          <header class="skills-header">
            <div>
              <h1 class="skills-heading">Skills 广场</h1>
              <p class="skills-caption">探索云端全部技能</p>
            </div>
          </header>
          <div class="search-wrap">
            <input id="skill-search" class="search-input" type="search" placeholder="搜索 skill 名称或简介" aria-label="搜索 skill" />
          </div>
          <div id="square-skill-list" class="skill-list" aria-label="云端 skills 列表"></div>
        </div>
      </section>
    </main>

    <dialog id="add-skill-dialog" class="upload-dialog" aria-labelledby="dialog-title">
      <div class="upload-dialog-content">
        <div class="dialog-header">
          <div>
            <h2 id="dialog-title" class="dialog-title">添加 Skill</h2>
            <p class="dialog-caption">填写信息并拖拽 skill 文件</p>
          </div>
          <button id="close-dialog" class="close-dialog" type="button" aria-label="关闭添加页面">&times;</button>
        </div>
        <div class="skill-form">
          <div class="skill-field">
            <label for="skill-name">Skill 名称</label>
            <input id="skill-name" type="text" placeholder="请输入 skill 名称" />
          </div>
          <div class="skill-field">
            <label for="skill-summary">Skill 简介</label>
            <textarea id="skill-summary" placeholder="请输入 skill 简介"></textarea>
          </div>
          <div class="skill-field">
            <label>Skill 文件</label>
            <div class="skill-drop-zone">
              <div>
                拖拽 skill 文件到这里
                <span>等待上传文件</span>
              </div>
            </div>
          </div>
          <button class="dialog-confirm" type="button">确认添加</button>
        </div>
      </div>
    </dialog>

    <script>
      const apiBase = 'http://127.0.0.1:8765/api/v1';
      let mySkills = [];
      let cloudSkills = [];

      const mySkillsTab = document.getElementById('my-skills-tab');
      const squareTab = document.getElementById('square-tab');
      const mySkillsView = document.getElementById('my-skills-view');
      const squareView = document.getElementById('square-view');
      const mySkillList = document.getElementById('my-skill-list');
      const squareSkillList = document.getElementById('square-skill-list');

      function renderSkillList(listElement, skills) {
        if (skills.length === 0) {
          listElement.innerHTML = '<div class="empty-search">暂无 Skill</div>';
          return;
        }

        listElement.innerHTML = skills.map((skill, index) => `
          <div class="skill-item" data-skill-id="${skill.id}">
            <div class="skill-item-header">
              <button class="skill-row" type="button">
                <span class="skill-name">${skill.name || skill.id}</span>
                <span class="skill-type">${skill.stage || 'common'}</span>
                <span class="skill-chevron">+</span>
              </button>
              ${listElement === mySkillList ? `
                <div class="skill-actions">
                  <button class="delete-skill-button" type="button" disabled>本地只读</button>
                </div>
              ` : ''}
            </div>
            <p class="skill-description">${skill.description || '暂无描述'}<br>标签：${(skill.tags || []).join(', ')}<br>路径：${skill.path || '-'}</p>
          </div>
        `).join('');

        listElement.querySelectorAll('.skill-row').forEach(row => {
          row.addEventListener('click', () => {
            const item = row.parentElement;
            const isExpanded = item.classList.toggle('expanded');
            row.querySelector('.skill-chevron').textContent = isExpanded ? '-' : '+';
          });
        });
      }

      async function loadSkillsFromApi() {
        try {
          const response = await fetch(`${apiBase}/skills?limit=100`);
          const body = await response.json();
          if (!response.ok) throw new Error(body.detail || 'Skill API unavailable');
          cloudSkills = body.data.skills || [];
          mySkills = cloudSkills.filter(skill => skill.path && skill.path.includes('personal'));
          renderSkillList(mySkillList, mySkills);
          renderSkillList(squareSkillList, cloudSkills);
        } catch (error) {
          mySkillList.innerHTML = `<div class="empty-search">无法连接本地 Skill API：${error.message}</div>`;
          squareSkillList.innerHTML = '<div class="empty-search">请先启动 FastAPI 服务。</div>';
        }
      }

      function showView(view) {
        const showingSquare = view === 'square';
        mySkillsView.hidden = showingSquare;
        squareView.hidden = !showingSquare;
        mySkillsTab.classList.toggle('active', !showingSquare);
        squareTab.classList.toggle('active', showingSquare);
      }

      loadSkillsFromApi();

      mySkillsTab.addEventListener('click', () => showView('mine'));
      squareTab.addEventListener('click', () => showView('square'));

      document.getElementById('skill-search').addEventListener('input', event => {
        const keyword = event.target.value.trim().toLowerCase();
        const filteredSkills = cloudSkills.filter(skill => `${skill.name}${skill.description}`.toLowerCase().includes(keyword));
        renderSkillList(squareSkillList, filteredSkills);
      });

      const addSkillDialog = document.getElementById('add-skill-dialog');
      document.getElementById('add-skill-button').addEventListener('click', () => addSkillDialog.showModal());
      document.getElementById('close-dialog').addEventListener('click', () => addSkillDialog.close());
      document.querySelector('.dialog-confirm').addEventListener('click', () => {
        const name = document.getElementById('skill-name').value.trim();
        const description = document.getElementById('skill-summary').value.trim();
        if (!name || !description) return;
        const id = `personal_${Date.now()}`;
        const yaml = [
          'schema_version: "1.0"',
          `skill_id: ${id}`,
          'version: "0.1.0"',
          `name_en: ${JSON.stringify(name)}`,
          `description: ${JSON.stringify(description)}`,
          'status: draft',
          'visibility: local',
          'agent_bindings:',
          '  director: true',
          '  cinematographer: false',
          '  editor: false',
          '  skills_manager: true',
          'tags: [personal]',
          'rules:',
          '  - id: personal_rule',
          '    when: {}',
          `    explanation: ${JSON.stringify(description)}`,
          'safety:',
          '  allowed_actions: [suggest_shot_sequence]',
          '  forbidden_actions: [direct_device_control, delete_media]'
        ].join('\n');
        const url = URL.createObjectURL(new Blob([yaml], {type:'text/yaml'}));
        const link = document.createElement('a');
        link.href = url; link.download = `${id}.yaml`; link.click();
        URL.revokeObjectURL(url);
        addSkillDialog.close();
        alert('已下载符合后端结构的 YAML 草稿。将文件放入 skills/repository/personal 后刷新页面。');
      });
    </script>
  </body>
</html>
