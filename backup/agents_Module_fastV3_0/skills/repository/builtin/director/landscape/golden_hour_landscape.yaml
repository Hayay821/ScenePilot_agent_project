skill_id: golden_hour_landscape_director
name: Golden Hour Landscape Planning
description: Planning landscape shots during golden hour for optimal natural lighting
language: en
author: builtin
status: active
stage: director
category: landscape
tags:
  - landscape
  - golden_hour
  - natural_light
  - composition

agent_bindings:
  director: true

rules:
  - condition: golden_hour_time
    action: plan_wide_establishing_shots
    priority: high
    reason: Golden hour provides soft, warm light ideal for landscape establishing shots

  - condition: horizon_visible
    action: apply_rule_of_thirds
    priority: high
    reason: Position horizon at 1/3 or 2/3 line for balanced composition

  - condition: strong_foreground_element
    action: use_leading_lines
    priority: medium
    reason: Foreground elements create depth and guide viewer's eye into the scene

  - condition: dramatic_sky
    action: emphasize_sky_in_frame
    priority: medium
    reason: Golden hour often produces colorful, dramatic skies worth highlighting

  - condition: water_present
    action: capture_reflections
    priority: medium
    reason: Still water during golden hour creates beautiful mirror reflections

metadata:
