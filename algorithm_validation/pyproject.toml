[project]
name = "scenepilot-algorithm-validation"
version = "0.1.0"
description = "ScenePilot: Event-driven AI Director - Algorithm Validation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "opencv-python-headless>=4.8.0",
    "av>=11.0.0",
    "ffmpeg-python>=0.2.0",
    "openai>=1.6.0",
    "httpx>=0.25.0",
    "tenacity>=8.2.0",
    "diskcache>=5.6.0",
    "ultralytics>=8.0.0",
    "imagehash>=4.3.0",
    "pillow>=10.1.0",
    "numpy>=1.24.0",
    "click>=8.1.0",
    "rich>=13.7.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.11.0",
    "ruff>=0.1.6",
]
enhanced = [
    "mediapipe>=0.10.0",
    "streamlit>=1.28.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
