<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ScenePilot Fast Tester</title>
  <style>
    :root { color-scheme: light; --ink:#17202a; --muted:#667085; --line:#d9dee7; --brand:#315efb; --bg:#f6f8fb; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
    .app { max-width:1180px; margin:0 auto; padding:24px; }
    header { display:flex; justify-content:space-between; align-items:end; gap:16px; margin-bottom:18px; }
    h1,h2,h3,p { margin:0; } h1 { font-size:25px; letter-spacing:-.03em; } h2 { font-size:15px; margin-bottom:12px; }
    .muted { color:var(--muted); margin-top:4px; }
    .status { display:flex; align-items:center; gap:8px; color:var(--muted); white-space:nowrap; }
    .dot { width:9px; height:9px; border-radius:50%; background:#98a2b3; } .dot.ok { background:#12b76a; } .dot.bad { background:#f04438; }
    .layout { display:grid; grid-template-columns:340px 1fr; gap:16px; }
    .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px; box-shadow:0 2px 8px #1018280a; }
    label { display:block; font-weight:650; margin:12px 0 5px; } label:first-of-type { margin-top:0; }
    input, textarea, select { width:100%; border:1px solid var(--line); border-radius:8px; padding:9px 10px; font:inherit; color:inherit; background:#fff; }
    textarea { resize:vertical; min-height:84px; }
    .row { display:flex; gap:8px; } .row > * { flex:1; }
    button { border:0; border-radius:8px; padding:9px 12px; background:var(--brand); color:#fff; font:inherit; cursor:pointer; }
    button.secondary { background:#eef2ff; color:#3048a8; } button.ghost { background:#f2f4f7; color:#344054; }
    button:disabled { opacity:.55; cursor:wait; }
    .buttons { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:14px; }
    .buttons button:last-child { grid-column:1/-1; }
    .hint { color:var(--muted); font-size:12px; margin-top:5px; }
    .result-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
    pre { margin:0; min-height:510px; max-height:680px; overflow:auto; padding:14px; border-radius:8px; background:#101828; color:#d1fadf; white-space:pre-wrap; word-break:break-word; }
    .history { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
    .history button { padding:5px 8px; font-size:12px; background:#f2f4f7; color:#344054; }
    @media (max-width:760px) { .app { padding:14px; } .layout { grid-template-columns:1fr; } header { align-items:start; flex-direction:column; } }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div><h1>ScenePilot Fast Tester</h1><p class="muted">轻量测试台：Skill、Director、摄影指导、Editor 和完整流程</p></div>
      <div class="status"><span id="dot" class="dot"></span><span id="status">未连接</span></div>
    </header>

    <div class="layout">
      <section class="card">
        <h2>请求配置</h2>
        <label for="base">API Base URL</label>
        <input id="base" value="http://127.0.0.1:8765/api/v1">

        <label for="text">用户需求</label>
        <textarea id="text">请拍摄一组自然的人像短片，保留人物和环境关系，不要明显摆拍。</textarea>

        <label for="stage">Skill 阶段</label>
        <select id="stage"><option value="director">Director</option><option value="cinematographer">Cinematographer</option><option value="editor">Editor</option></select>

        <label for="paths">媒体路径，每行一个</label>
        <textarea id="paths">data/img/img1.jpg
data/video/test_video1.mp4</textarea>
        <div class="hint">路径是服务端路径。也可以使用绝对路径。</div>

        <div class="buttons">
          <button onclick="health()" class="secondary">连接检查</button>
          <button onclick="listSkills()" class="secondary">列出 Skills</button>
          <button onclick="selectSkills()">匹配 Skill</button>
          <button onclick="callAgent('director')">导演 Agent</button>
          <button onclick="callAgent('cinematographer')">摄影指导</button>
          <button onclick="callAgent('editor')">Editor</button>
          <button onclick="runAll()">运行完整流程</button>
        </div>
        <div id="history" class="history"></div>
      </section>

      <section class="card">
        <div class="result-head"><h2>响应结果</h2><button class="ghost" onclick="copyResult()">复制 JSON</button></div>
        <pre id="output">点击左侧按钮开始测试。</pre>
      </section>
    </div>
  </main>

  <script>
    const $ = id => document.getElementById(id);
    const paths = () => $('paths').value.split(/\r?\n/).map(v => v.trim()).filter(Boolean);
    const base = () => $('base').value.replace(/\/$/, '');
    const mediaInput = () => ({ source_type:'FILE', paths:paths() });
    let busy = false;

    function show(data) {
      $('output').textContent = JSON.stringify(data, null, 2);
      const item = document.createElement('button');
      item.textContent = new Date().toLocaleTimeString();
      item.onclick = () => $('output').textContent = JSON.stringify(data, null, 2);
      $('history').prepend(item);
    }

    async function request(path, options = {}) {
      if (busy) return;
      busy = true; $('status').textContent = '请求中...'; $('dot').className = 'dot';
      try {
        const response = await fetch(base() + path, { headers:{'Content-Type':'application/json'}, ...options });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || `HTTP ${response.status}`);
        show(data); $('status').textContent = '连接正常'; $('dot').className = 'dot ok';
      } catch (error) {
        show({success:false, error:String(error)}); $('status').textContent = '请求失败'; $('dot').className = 'dot bad';
      } finally { busy = false; }
    }

    function health() { request('/health'); }
    function listSkills() { request('/skills?limit=20'); }
    function selectSkills() {
      request('/skills/select', {method:'POST', body:JSON.stringify({user_text:$('text').value, stage:$('stage').value, limit:3})});
    }
    function callAgent(agent) {
      const body = { user_text:$('text').value, media_input:mediaInput(), skills_filter:{stage:agent, limit:3}, output_config:{output_dir:'outputs', save_intermediate:true} };
      request('/agents/' + agent, {method:'POST', body:JSON.stringify(body)});
    }
    function runAll() {
      request('/agents/run-all', {method:'POST', body:JSON.stringify({user_text:$('text').value, media_dir:'data', output_config:{output_dir:'outputs', save_intermediate:true}})});
    }
    async function copyResult() { await navigator.clipboard?.writeText($('output').textContent); }
  </script>
</body>
</html>
