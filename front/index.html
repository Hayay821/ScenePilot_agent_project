<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BoldMaker 登录页面" />
    <title>登录 | BoldMaker</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="login-page">
      <section class="brand-panel" aria-label="BoldMaker 品牌介绍">
        <div class="brand-mark" aria-hidden="true">B</div>
        <p class="eyebrow">BOLDMAKER AI</p>
        <h1>让每一次记录，<br /><em>都更有力量。</em></h1>
        <p class="brand-description">
          面向新一代创作者的智能影像工作台，让灵感从拍摄现场延伸到每一个精彩瞬间。
        </p>
        <div class="brand-line" aria-hidden="true"></div>
        <p class="brand-note">CREATE WITH PURPOSE</p>
      </section>

      <section class="form-panel" aria-labelledby="login-title">
        <div class="form-wrap">
          <div class="mobile-brand" aria-hidden="true">
            <span class="mobile-brand-mark">B</span>
            <span>BOLDMAKER</span>
          </div>
          <p class="form-kicker">WELCOME BACK</p>
          <h2 id="login-title">欢迎回来</h2>
          <p class="form-description">登录你的创作者空间，继续你的创作旅程。</p>

          <form class="login-form" id="login-form">
            <div class="field-group">
              <label for="account">账号</label>
              <input id="account" name="account" type="text" placeholder="请输入账号" autocomplete="username" required />
            </div>

            <div class="field-group">
              <label for="password">密码</label>
              <input id="password" name="password" type="password" placeholder="请输入密码" autocomplete="current-password" required />
            </div>

            <p class="form-error" id="login-error" role="alert" hidden></p>
            <div class="form-actions">
              <button class="primary-button" id="login-button" type="submit">登录</button>
              <div class="secondary-actions">
                <button class="text-button" type="button" onclick="window.location.href='./recover.html'">密码找回</button>
                <span class="action-divider" aria-hidden="true"></span>
                <button class="text-button" type="button" onclick="window.location.href='./register.html'">注册</button>
              </div>
            </div>
          </form>

          <p class="copyright">© 2026 BoldMaker. All rights reserved.</p>
        </div>
      </section>
    </main>

    <script>
      const cloudApiBase = localStorage.getItem('boldmaker_cloud_api') || 'http://120.26.152.99:8000';
      const loginForm = document.getElementById('login-form');
      const loginButton = document.getElementById('login-button');
      const loginError = document.getElementById('login-error');

      async function responseError(response) {
        try {
          const body = await response.json();
          return body.detail || `登录失败（${response.status}）`;
        } catch (_) {
          return `登录失败（${response.status}）`;
        }
      }

      loginForm.addEventListener('submit', async event => {
        event.preventDefault();
        loginError.hidden = true;
        loginButton.disabled = true;
        loginButton.textContent = '登录中...';

        const form = new URLSearchParams();
        form.set('username', document.getElementById('account').value.trim());
        form.set('password', document.getElementById('password').value);

        try {
          const response = await fetch(`${cloudApiBase}/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: form,
          });
          if (!response.ok) throw new Error(await responseError(response));

          const session = await response.json();
          localStorage.setItem('boldmaker_cloud_token', session.access_token);
          localStorage.setItem('boldmaker_uid', String(session.user_id));
          localStorage.setItem('boldmaker_account', session.username);
          window.location.href = './home.html';
        } catch (error) {
          loginError.textContent = error.message === 'Failed to fetch' ? '无法连接云端服务器，请稍后重试。' : error.message;
          loginError.hidden = false;
          loginButton.disabled = false;
          loginButton.textContent = '登录';
        }
      });
    </script>
  </body>
</html>
