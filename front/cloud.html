<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BoldMaker</title>
    <style>
      :root {
        --home-ink: #20252b;
        --home-line: #e1e3e1;
        --home-paper: #f8f8f5;
        --home-muted: #7b8284;
        --home-accent: #de6943;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        color: var(--home-ink);
        background: var(--home-paper);
        font-family: 'Microsoft YaHei', sans-serif;
      }

      .top-navigation {
        display: grid;
        width: 100%;
        height: 58px;
        grid-template-columns: repeat(4, 1fr);
        border-bottom: 1px solid var(--home-line);
        background: rgba(255, 255, 255, 0.72);
      }

      .top-navigation span {
        display: grid;
        min-width: 0;
        place-items: center;
        color: #60676a;
        text-decoration: none;
        font-size: 13px;
        font-weight: 500;
      }

      .top-navigation a {
        display: grid;
        min-width: 0;
        place-items: center;
        color: #60676a;
        text-decoration: none;
        font-size: 13px;
        font-weight: 500;
      }

      .top-navigation .selected {
        color: var(--home-paper);
        background: var(--home-ink);
      }

      .repository-page {
        min-height: calc(100vh - 58px);
        padding: 34px clamp(24px, 5vw, 72px) 64px;
      }

      .repository-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 34px;
      }

      .repository-heading {
        margin: 0;
        font-size: 24px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      .repository-caption {
        margin: 9px 0 0;
        color: var(--home-muted);
        font-size: 13px;
      }

      .cloud-button,
      .add-material {
        border: 1px solid var(--home-ink);
        color: var(--home-paper);
        background: var(--home-ink);
        cursor: pointer;
        font-family: inherit;
      }

      .cloud-button {
        flex: 0 0 auto;
        min-height: 40px;
        padding: 0 18px;
        border-radius: 2px;
        font-size: 13px;
      }

      .material-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
        gap: 18px;
      }

      .material-card {
        display: grid;
        min-width: 0;
        aspect-ratio: 4 / 3;
        overflow: hidden;
        grid-template-rows: minmax(0, 1fr) auto;
        border: 1px solid var(--home-line);
        border-radius: 3px;
        background: #ffffff;
      }

      .material-preview {
        display: grid;
        min-height: 0;
        place-items: center;
        color: var(--home-muted);
        background: #e9ece9;
      }

      .material-preview img,
      .material-preview video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .material-info {
        min-width: 0;
        padding: 8px 10px;
        border-top: 1px solid var(--home-line);
      }

      .material-name {
        overflow: hidden;
        margin: 0;
        font-size: 12px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .material-meta {
        margin: 4px 0 0;
        color: var(--home-muted);
        font-size: 10px;
      }

      .material-error,
      .material-empty {
        grid-column: 1 / -1;
        padding: 12px;
        color: var(--home-muted);
        font-size: 13px;
      }

      .material-error {
        color: #bd5132;
      }

      .add-material {
        min-width: 0;
        aspect-ratio: 4 / 3;
        border-radius: 3px;
      }

      .add-material {
        display: grid;
        place-items: center;
        padding: 20px;
        border-style: dashed;
        border-color: #b9bfbe;
        color: var(--home-muted);
        background: transparent;
        font-size: 13px;
      }

      .add-material-inner {
        display: grid;
        justify-items: center;
        gap: 10px;
      }

      .add-symbol {
        display: grid;
        width: 38px;
        height: 38px;
        place-items: center;
        border: 1px solid #b9bfbe;
        border-radius: 50%;
        color: var(--home-ink);
        font-size: 23px;
        font-weight: 300;
        line-height: 1;
      }

      .upload-dialog {
        width: min(90vw, 520px);
        padding: 0;
        border: 0;
        border-radius: 4px;
        color: var(--home-ink);
        background: var(--home-paper);
        box-shadow: 0 18px 60px rgba(32, 37, 43, 0.22);
      }

      .upload-dialog::backdrop {
        background: rgba(32, 37, 43, 0.42);
      }

      .upload-dialog-content {
        padding: 28px;
      }

      .upload-dialog-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 20px;
      }

      .upload-dialog-title {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
      }

      .upload-dialog-caption {
        margin: 7px 0 0;
        color: var(--home-muted);
        font-size: 12px;
      }

      .close-dialog {
        width: 28px;
        height: 28px;
        padding: 0;
        border: 1px solid var(--home-line);
        border-radius: 50%;
        color: var(--home-muted);
        background: transparent;
        cursor: pointer;
        font-size: 18px;
        line-height: 1;
      }

      .drop-zone {
        display: grid;
        min-height: 180px;
        place-items: center;
        border: 1px dashed #b9bfbe;
        border-radius: 2px;
        color: var(--home-muted);
        background: #ffffff;
        font-size: 13px;
        text-align: center;
      }

      .drop-zone span {
        display: block;
        margin-top: 8px;
        color: #a2a8a8;
        font-size: 11px;
      }

      @media (max-width: 480px) {
        .top-navigation {
          height: 52px;
        }

        .top-navigation span,
        .top-navigation a {
          font-size: 12px;
        }

        .repository-page {
          min-height: calc(100vh - 52px);
          padding: 24px 18px 42px;
        }

        .repository-header {
          display: block;
          margin-bottom: 26px;
        }

        .cloud-button {
          margin-top: 20px;
        }

        .material-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 10px;
        }

        .upload-dialog-content {
          padding: 22px;
        }
      }
    </style>
  </head>
  <body>
    <nav class="top-navigation" aria-label="主页面板选择">
      <span class="selected" aria-current="page">仓库</span>
      <a href="./create.html">创作</a>
      <a href="./skills.html">skills</a>
      <a href="./settings.html">用户设置</a>
    </nav>

    <main class="repository-page">
      <header class="repository-header">
        <div>
          <h1 class="repository-heading">素材仓库</h1>
          <p class="repository-caption">管理你的图片与视频素材</p>
        </div>
        <button class="cloud-button" type="button" onclick="window.location.href='./home.html'">返回本地仓库</button>
      </header>

      <section class="material-grid" aria-label="视频和图片素材">
        <button class="add-material" type="button" onclick="document.getElementById('upload-dialog').showModal()">
          <span class="add-material-inner">
            <span class="add-symbol" aria-hidden="true">+</span>
            <span>添加素材</span>
          </span>
        </button>
      </section>

      <dialog id="upload-dialog" class="upload-dialog" aria-labelledby="upload-dialog-title">
        <div class="upload-dialog-content">
          <div class="upload-dialog-header">
            <div>
              <h2 id="upload-dialog-title" class="upload-dialog-title">上传素材</h2>
              <p class="upload-dialog-caption">将图片或视频拖拽到下方区域</p>
            </div>
            <button class="close-dialog" type="button" aria-label="关闭上传窗口" onclick="document.getElementById('upload-dialog').close()">&times;</button>
          </div>
          <label class="drop-zone" for="cloud-material-file">
            <div>
              拖拽文件到这里
              <span>支持 JPG、PNG、GIF、WebP、MP4、MOV 与 WebM，最大 200MB</span>
            </div>
          </label>
          <input id="cloud-material-file" type="file" accept="image/jpeg,image/png,image/gif,image/webp,video/mp4,video/quicktime,video/webm" hidden />
        </div>
      </dialog>
    </main>

    <script>
      const cloudApiBase = localStorage.getItem('boldmaker_cloud_api') || 'http://120.26.152.99:8000';
      const materialGrid = document.querySelector('.material-grid');
      const uploadDialog = document.getElementById('upload-dialog');
      const materialFile = document.getElementById('cloud-material-file');
      const dropZone = document.querySelector('.drop-zone');
      const objectUrls = new Set();

      function cloudHeaders() {
        return { Authorization: `Bearer ${localStorage.getItem('boldmaker_cloud_token')}` };
      }

      function redirectToLogin() {
        localStorage.removeItem('boldmaker_cloud_token');
        localStorage.removeItem('boldmaker_local_token');
        localStorage.removeItem('boldmaker_uid');
        window.location.replace('./index.html');
      }

      async function responseError(response) {
        try {
          const body = await response.json();
          return body.detail || `操作失败（${response.status}）`;
        } catch (_) {
          return `操作失败（${response.status}）`;
        }
      }

      function showError(message) {
        materialGrid.querySelectorAll('.material-error').forEach(element => element.remove());
        const error = document.createElement('div');
        error.className = 'material-error';
        error.textContent = message;
        materialGrid.prepend(error);
      }

      function formatSize(bytes) {
        if (bytes < 1024) return `${bytes} B`;
        if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
        return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
      }

      async function authenticatedFetch(url, options = {}) {
        const response = await fetch(url, { ...options, headers: { ...cloudHeaders(), ...options.headers } });
        if (response.status === 401 || response.status === 403) {
          redirectToLogin();
          throw new Error('登录已失效');
        }
        return response;
      }

      async function loadPreview(item, preview) {
        const response = await authenticatedFetch(`${cloudApiBase}${item.url}`);
        if (!response.ok) throw new Error(await responseError(response));
        const objectUrl = URL.createObjectURL(await response.blob());
        objectUrls.add(objectUrl);
        const media = document.createElement(item.content_type.startsWith('video/') ? 'video' : 'img');
        media.src = objectUrl;
        media.alt = item.filename;
        if (media.tagName === 'VIDEO') {
          media.controls = true;
          media.preload = 'metadata';
        }
        preview.replaceChildren(media);
      }

      function createMaterialCard(item) {
        const card = document.createElement('article');
        card.className = 'material-card';

        const preview = document.createElement('div');
        preview.className = 'material-preview';
        preview.textContent = item.content_type.startsWith('video/') ? '▶' : '加载中...';

        const info = document.createElement('div');
        info.className = 'material-info';
        const name = document.createElement('p');
        name.className = 'material-name';
        name.textContent = item.filename;
        name.title = item.filename;
        const meta = document.createElement('p');
        meta.className = 'material-meta';
        meta.textContent = `${formatSize(item.size)} · ${new Date(item.created_at).toLocaleString()}`;
        info.append(name, meta);
        card.append(preview, info);
        loadPreview(item, preview).catch(error => {
          preview.textContent = '预览失败';
          showError(error.message);
        });
        return card;
      }

      async function loadMaterials() {
        objectUrls.forEach(url => URL.revokeObjectURL(url));
        objectUrls.clear();
        const response = await authenticatedFetch(`${cloudApiBase}/media`);
        if (!response.ok) throw new Error(await responseError(response));
        materialGrid.querySelectorAll('.material-card, .material-error, .material-empty').forEach(element => element.remove());
        const items = await response.json();
        if (!items.length) {
          const empty = document.createElement('div');
          empty.className = 'material-empty';
          empty.textContent = '云仓库暂无影像素材。';
          materialGrid.append(empty);
          return;
        }
        items.forEach(item => materialGrid.append(createMaterialCard(item)));
      }

      async function uploadMaterial(file) {
        if (!file.type.startsWith('image/') && !file.type.startsWith('video/')) {
          throw new Error('只支持图片或视频文件。');
        }
        const formData = new FormData();
        formData.append('file', file);
        const response = await authenticatedFetch(`${cloudApiBase}/media/upload`, {
          method: 'POST',
          body: formData,
        });
        if (!response.ok) throw new Error(await responseError(response));
      }

      materialFile.addEventListener('change', async () => {
        const file = materialFile.files[0];
        if (!file) return;
        dropZone.firstElementChild.firstChild.textContent = '上传中...';
        try {
          await uploadMaterial(file);
          uploadDialog.close();
          await loadMaterials();
        } catch (error) {
          showError(error.message === 'Failed to fetch' ? '无法连接云端服务器，请稍后重试。' : error.message);
        } finally {
          dropZone.firstElementChild.firstChild.textContent = '拖拽文件到这里';
          materialFile.value = '';
        }
      });

      dropZone.addEventListener('dragover', event => {
        event.preventDefault();
        dropZone.style.borderColor = 'var(--home-accent)';
      });
      dropZone.addEventListener('dragleave', () => {
        dropZone.style.borderColor = '';
      });
      dropZone.addEventListener('drop', event => {
        event.preventDefault();
        dropZone.style.borderColor = '';
        materialFile.files = event.dataTransfer.files;
        materialFile.dispatchEvent(new Event('change'));
      });

      async function start() {
        if (!localStorage.getItem('boldmaker_cloud_token')) return redirectToLogin();
        try {
          const profileResponse = await authenticatedFetch(`${cloudApiBase}/me`);
          if (!profileResponse.ok) throw new Error(await responseError(profileResponse));
          const profile = await profileResponse.json();
          document.querySelector('.repository-caption').textContent = `${profile.username} 的云端图片与视频素材`;
          await loadMaterials();
        } catch (error) {
          if (error.message !== '登录已失效') showError(error.message === 'Failed to fetch' ? '无法连接云端服务器，请稍后重试。' : error.message);
        }
      }

      window.addEventListener('beforeunload', () => objectUrls.forEach(url => URL.revokeObjectURL(url)));
      start();
    </script>
  </body>
</html>
