<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BoldMaker</title>
    <style>
      :root {
        --home-ink: #20252b;
        --home-line: #e1e3e1;
        --home-paper: #f8f8f5;
        --asset-width: 260px;
        --agent-width: 320px;
        --device-height: 180px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        color: var(--home-ink);
        background: var(--home-paper);
        font-family: 'Microsoft YaHei', sans-serif;
      }

      .top-navigation {
        display: grid;
        width: 100%;
        height: 58px;
        grid-template-columns: repeat(4, 1fr);
        border-bottom: 1px solid var(--home-line);
        background: rgba(255, 255, 255, 0.72);
      }

      .top-navigation span,
      .top-navigation a {
        display: grid;
        min-width: 0;
        place-items: center;
        color: #60676a;
        text-decoration: none;
        font-size: 13px;
        font-weight: 500;
      }

      .top-navigation .selected {
        color: var(--home-paper);
        background: var(--home-ink);
      }

      .create-workspace {
        display: grid;
        height: calc(100vh - 58px);
        min-height: 0;
        grid-template-columns: var(--asset-width) 10px minmax(0, 1fr) 10px var(--agent-width);
      }

      .asset-panel {
        min-width: 0;
        overflow: hidden;
        border-right: 1px solid var(--home-line);
        background: #fbfbf9;
      }

      .asset-header {
        display: flex;
        height: 52px;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
        border-bottom: 1px solid var(--home-line);
      }

      .asset-title {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
      }

      .asset-add-button {
        width: 28px;
        height: 28px;
        padding: 0;
        border: 0;
        color: #687173;
        background: transparent;
        cursor: pointer;
        font-size: 20px;
        line-height: 1;
      }

      .asset-content {
        height: calc(100% - 52px);
        overflow: auto;
        padding: 16px 12px;
      }

      .asset-group-title {
        margin: 10px 8px 8px;
        color: #7b8284;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
      }

      .asset-empty {
        margin: 0 8px 24px;
        color: #a1a8a7;
        font-size: 12px;
        line-height: 1.8;
      }

      .asset-item {
        display: flex;
        width: 100%;
        align-items: center;
        gap: 9px;
        padding: 9px 8px;
        border: 0;
        border-radius: 2px;
        color: #596365;
        background: transparent;
        cursor: pointer;
        font-family: inherit;
        font-size: 12px;
        text-align: left;
      }

      .asset-item:hover {
        background: #eef0ed;
      }

      .asset-symbol {
        display: grid;
        width: 26px;
        height: 22px;
        flex: 0 0 auto;
        place-items: center;
        border: 1px solid #c2c9c6;
        border-radius: 2px;
        color: #8a9391;
        font-size: 9px;
      }

      .asset-item {
        position: relative;
      }

      .asset-item.active {
        color: var(--home-ink);
        background: #eef0ed;
      }

      .asset-label {
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .asset-thumb {
        display: grid;
        width: 30px;
        height: 24px;
        flex: 0 0 auto;
        place-items: center;
        overflow: hidden;
        border: 1px solid #c2c9c6;
        border-radius: 2px;
        color: #8a9391;
        background: #e9ece9;
        font-size: 10px;
      }

      .asset-thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .asset-remove {
        position: absolute;
        top: 4px;
        right: 6px;
        padding: 0 4px;
        color: #a1a8a7;
        font-size: 13px;
        line-height: 1;
      }

      .asset-remove:hover {
        color: #bd5132;
      }

      .asset-picker {
        width: min(92vw, 640px);
        padding: 0;
        border: 0;
        border-radius: 4px;
        color: var(--home-ink);
        background: var(--home-paper);
        box-shadow: 0 18px 60px rgba(32, 37, 43, 0.22);
      }

      .asset-picker::backdrop {
        background: rgba(32, 37, 43, 0.42);
      }

      .asset-picker-content {
        padding: 24px;
      }

      .asset-picker-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 18px;
      }

      .asset-picker-title {
        margin: 0;
        font-size: 17px;
        font-weight: 600;
      }

      .asset-picker-caption {
        margin: 6px 0 0;
        color: #7b8284;
        font-size: 12px;
      }

      .asset-picker-close {
        width: 28px;
        height: 28px;
        padding: 0;
        border: 1px solid var(--home-line);
        border-radius: 50%;
        color: #7b8284;
        background: transparent;
        cursor: pointer;
        font-size: 18px;
        line-height: 1;
      }

      .asset-picker-grid {
        display: grid;
        max-height: 60vh;
        grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
        gap: 12px;
        overflow: auto;
      }

      .asset-picker-item {
        display: grid;
        gap: 6px;
        padding: 8px;
        border: 1px solid var(--home-line);
        border-radius: 3px;
        color: #596365;
        background: #ffffff;
        cursor: pointer;
        font-family: inherit;
        font-size: 11px;
        text-align: left;
      }

      .asset-picker-item:hover {
        border-color: var(--home-ink);
      }

      .asset-picker-item.selected {
        border-color: var(--home-accent);
        box-shadow: inset 0 0 0 1px var(--home-accent);
      }

      .asset-picker-thumb {
        display: grid;
        aspect-ratio: 4 / 3;
        place-items: center;
        overflow: hidden;
        border-radius: 2px;
        color: #8a9391;
        background: #e9ece9;
        font-size: 20px;
      }

      .asset-picker-thumb img,
      .asset-picker-thumb video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .asset-picker-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .asset-picker-empty,
      .asset-picker-error {
        grid-column: 1 / -1;
        padding: 20px;
        color: #7b8284;
        font-size: 13px;
        text-align: center;
      }

      .asset-picker-error {
        color: #bd5132;
      }

      .asset-splitter {
        position: relative;
        z-index: 2;
        cursor: col-resize;
        background: var(--home-line);
        touch-action: none;
        user-select: none;
      }

      .asset-splitter:hover,
      .asset-splitter.dragging {
        background: #de6943;
      }

      .create-empty-area {
        display: grid;
        grid-column: 3;
        grid-template-rows: minmax(0, 1fr) 10px var(--device-height);
        min-width: 0;
        background: var(--home-paper);
      }

      .preview-panel,
      .device-panel {
        min-height: 0;
        overflow: hidden;
      }

      .preview-panel {
        display: grid;
        place-items: center;
        background: #edf0ec;
        cursor: grab;
        touch-action: none;
      }

      .preview-panel.is-dragging {
        cursor: grabbing;
      }

      .preview-placeholder {
        display: grid;
        justify-items: center;
        gap: 12px;
        color: #8d9895;
        font-size: 13px;
        letter-spacing: 0.08em;
      }

      .preview-frame {
        position: relative;
        display: grid;
        width: min(78%, 700px);
        aspect-ratio: 16 / 9;
        place-items: center;
        overflow: hidden;
        border: 1px solid #3f494b;
        background: #2d3539;
      }

      .preview-media {
        display: grid;
        width: 100%;
        height: 100%;
        place-items: center;
        overflow: hidden;
        cursor: grab;
        touch-action: none;
      }

      .preview-panel.is-dragging,
      .preview-panel.is-dragging .preview-media {
        cursor: grabbing;
      }

      .preview-media-element {
        display: block;
        max-width: 100%;
        max-height: 100%;
        user-select: none;
        -webkit-user-drag: none;
        transform-origin: center center;
        transition: transform 120ms ease;
      }

      .preview-media.is-dragging .preview-media-element {
        transition: none;
      }

      .preview-toolbar {
        position: absolute;
        top: 10px;
        right: 10px;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 6px;
        border-radius: 3px;
        background: rgba(32, 37, 43, 0.72);
      }

      .preview-toolbar button {
        width: 26px;
        height: 26px;
        padding: 0;
        border: 0;
        border-radius: 2px;
        color: #ffffff;
        background: transparent;
        cursor: pointer;
        font-size: 16px;
        line-height: 1;
      }

      .preview-toolbar button:hover {
        background: rgba(255, 255, 255, 0.18);
      }

      .preview-zoom-value {
        min-width: 38px;
        color: #ffffff;
        font-size: 11px;
        text-align: center;
      }

      .play-mark {
        display: grid;
        width: 42px;
        height: 42px;
        place-items: center;
        border: 1px solid #a6b0ad;
        border-radius: 50%;
        color: #a6b0ad;
        font-size: 17px;
      }

      .center-splitter {
        z-index: 2;
        cursor: row-resize;
        background: var(--home-line);
        touch-action: none;
        user-select: none;
      }

      .center-splitter:hover,
      .center-splitter.dragging {
        background: #de6943;
      }

      .device-panel {
        border-top: 1px solid var(--home-line);
        background: #fbfbf9;
      }

      .device-header {
        display: flex;
        height: 44px;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
        border-bottom: 1px solid var(--home-line);
      }

      .device-title {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
      }

      .device-content {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
        padding: 12px 16px;
      }

      .device-section-title {
        margin: 0 0 8px;
        color: #7b8284;
        font-size: 11px;
        font-weight: 600;
      }

      .device-row {
        display: flex;
        min-height: 25px;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        color: #596365;
        font-size: 12px;
      }

      .device-name {
        display: flex;
        align-items: center;
        gap: 7px;
      }

      .status-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #bfc5c3;
      }

      .device-state,
      .parameter-value {
        color: #7b8284;
        font-size: 11px;
      }

      .agent-splitter {
        position: relative;
        z-index: 2;
        grid-column: 4;
        cursor: col-resize;
        background: var(--home-line);
        touch-action: none;
        user-select: none;
      }

      .agent-splitter:hover,
      .agent-splitter.dragging {
        background: #de6943;
      }

      .agent-panel {
        display: flex;
        flex-direction: column;
        min-height: 0;
        grid-column: 5;
        min-width: 0;
        overflow: hidden;
        background: #fbfbf9;
      }

      .agent-menu,
      .agent-screen {
        display: flex;
        min-height: 0;
        flex-direction: column;
      }

      .agent-menu {
        gap: 8px;
        padding: 18px 14px;
      }

      .agent-screen {
        height: 100%;
      }

      .agent-screen[hidden],
      .agent-menu[hidden] {
        display: none;
      }

      .agent-option {
        width: 100%;
        min-height: 44px;
        padding: 0 12px;
        border: 1px solid var(--home-line);
        border-radius: 2px;
        color: #596365;
        background: #ffffff;
        cursor: pointer;
        font-family: inherit;
        font-size: 13px;
        text-align: left;
      }

      .agent-option:hover {
        border-color: var(--home-ink);
        color: var(--home-ink);
      }

      .agent-screen-header {
        display: flex;
        min-height: 48px;
        align-items: center;
        gap: 10px;
        padding: 0 14px;
        border-bottom: 1px solid var(--home-line);
      }

      .agent-back-button {
        padding: 5px 0;
        border: 0;
        color: #7b8284;
        background: transparent;
        cursor: pointer;
        font-family: inherit;
        font-size: 12px;
      }

      .agent-back-button:hover {
        color: var(--home-ink);
      }

      .agent-screen-title {
        min-width: 0;
        margin: 0;
        overflow: hidden;
        font-size: 13px;
        font-weight: 600;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .new-conversation-button {
        min-height: 40px;
        margin: 14px;
        border: 1px dashed #abb4b1;
        border-radius: 2px;
        color: #596365;
        background: transparent;
        cursor: pointer;
        font-family: inherit;
        font-size: 12px;
      }

      .new-conversation-button:hover {
        border-color: #de6943;
        color: #bd5132;
      }

      .conversation-list {
        flex: 1;
        overflow: auto;
        padding: 0 14px 14px;
      }

      .empty-conversations {
        margin: 26px 8px;
        color: #a1a8a7;
        font-size: 12px;
        line-height: 1.7;
        text-align: center;
      }

      .chat-messages {
        flex: 1;
        min-height: 0;
      }

      .chat-input-bar {
        display: flex;
        gap: 8px;
        padding: 12px 14px;
        border-top: 1px solid var(--home-line);
      }

      .chat-input {
        width: 100%;
        min-width: 0;
        height: 36px;
        padding: 0 10px;
        border: 1px solid var(--home-line);
        outline: none;
        color: var(--home-ink);
        background: #ffffff;
        font-family: inherit;
        font-size: 12px;
      }

      .chat-send {
        width: 36px;
        flex: 0 0 auto;
        border: 0;
        color: var(--home-paper);
        background: var(--home-ink);
        cursor: pointer;
      }

      .create-workspace.is-resizing {
        user-select: none;
      }

      @media (max-width: 480px) {
        .top-navigation {
          height: 52px;
        }

        .top-navigation span,
        .top-navigation a {
          font-size: 12px;
        }

        .create-workspace {
          height: calc(100vh - 52px);
          grid-template-columns: minmax(180px, 46vw) 10px minmax(0, 1fr) 10px minmax(220px, 42vw);
        }

        .device-content {
          grid-template-columns: 1fr;
          gap: 8px;
          overflow: auto;
        }
      }
    </style>
  </head>
  <body>
    <nav class="top-navigation" aria-label="主页面板选择">
      <a href="./home.html">仓库</a>
      <span class="selected" aria-current="page">创作</span>
      <a href="./skills.html">skills</a>
      <a href="./settings.html">用户设置</a>
    </nav>

    <main class="create-workspace">
      <aside class="asset-panel" aria-label="素材库面板">
        <header class="asset-header">
          <h1 class="asset-title">素材库</h1>
          <button id="asset-add-button" class="asset-add-button" type="button" aria-label="添加素材">+</button>
        </header>
        <div class="asset-content">
          <p class="asset-group-title">本地素材</p>
          <div id="asset-local-list"></div>
          <p class="asset-group-title">项目文件</p>
          <button class="asset-item" type="button">
            <span class="asset-symbol">DIR</span>
            <span>当前创作项目</span>
          </button>
        </div>
      </aside>

      <div class="asset-splitter" aria-label="调整素材库宽度"></div>
      <section class="create-empty-area" aria-label="中间创作区域">
        <section class="preview-panel" aria-label="视频和图片播放展示面板">
          <div id="preview-frame" class="preview-frame">
            <div id="preview-media" class="preview-media">
              <div class="preview-placeholder">
                <span class="play-mark">▶</span>
                <span>等待视频或图片素材</span>
              </div>
            </div>
            <div id="preview-toolbar" class="preview-toolbar" hidden>
              <button id="preview-zoom-out" type="button" aria-label="缩小">−</button>
              <span id="preview-zoom-value" class="preview-zoom-value">100%</span>
              <button id="preview-zoom-in" type="button" aria-label="放大">+</button>
              <button id="preview-close" type="button" aria-label="退出展示">×</button>
            </div>
          </div>
        </section>

        <div class="center-splitter" aria-label="调整视频和设备面板高度"></div>

        <section class="device-panel" aria-label="设备连接面板">
          <header class="device-header">
            <h2 class="device-title">设备连接</h2>
            <span class="device-state">未连接设备</span>
          </header>
          <div class="device-content">
            <div>
              <h3 class="device-section-title">可用设备</h3>
              <div class="device-row">
                <span class="device-name"><span class="status-dot"></span>Link 2</span>
                <span class="device-state">未连接</span>
              </div>
              <div class="device-row">
                <span class="device-name"><span class="status-dot"></span>X4 Air</span>
                <span class="device-state">未连接</span>
              </div>
            </div>
            <div>
              <h3 class="device-section-title">连接参数</h3>
              <div class="device-row"><span>连接方式</span><span class="parameter-value">USB / Wi-Fi</span></div>
              <div class="device-row"><span>状态</span><span class="parameter-value">等待连接</span></div>
            </div>
            <div>
              <h3 class="device-section-title">设备模式</h3>
              <div class="device-row"><span>拍摄模式</span><span class="parameter-value">待机</span></div>
              <div class="device-row"><span>追踪模式</span><span class="parameter-value">关闭</span></div>
            </div>
          </div>
        </section>
      </section>
      <div class="agent-splitter" aria-label="调整 Agent 面板宽度"></div>
      <aside class="agent-panel" aria-label="Agent 对话面板">
        <div id="agent-menu" class="agent-menu">
          <button class="agent-option" type="button" data-agent="skills管理师">skills管理师</button>
          <button class="agent-option" type="button" data-agent="导演">导演</button>
          <button class="agent-option" type="button" data-agent="摄影师">摄影师</button>
          <button class="agent-option" type="button" data-agent="剪辑师">剪辑师</button>
        </div>

        <div id="conversation-list-screen" class="agent-screen" hidden>
          <header class="agent-screen-header">
            <button id="conversation-list-back" class="agent-back-button" type="button">返回</button>
            <h2 id="conversation-list-title" class="agent-screen-title"></h2>
          </header>
          <button id="new-conversation-button" class="new-conversation-button" type="button">+ 新建对话</button>
          <div class="conversation-list">
            <p class="empty-conversations">暂无历史对话</p>
          </div>
        </div>

        <div id="chat-screen" class="agent-screen" hidden>
          <header class="agent-screen-header">
            <button id="chat-back-button" class="agent-back-button" type="button">返回</button>
            <h2 id="chat-title" class="agent-screen-title"></h2>
          </header>
          <div class="chat-messages" aria-label="对话内容"></div>
          <div class="chat-input-bar">
            <input class="chat-input" type="text" placeholder="输入消息" />
            <button class="chat-send" type="button" aria-label="发送">↑</button>
          </div>
        </div>
      </aside>
    </main>

    <dialog id="asset-picker" class="asset-picker" aria-labelledby="asset-picker-title">
      <div class="asset-picker-content">
        <div class="asset-picker-header">
          <div>
            <h2 id="asset-picker-title" class="asset-picker-title">从本地仓库选择素材</h2>
            <p class="asset-picker-caption">点击图片或视频，将其导入左侧素材库</p>
          </div>
          <button id="asset-picker-close" class="asset-picker-close" type="button" aria-label="关闭素材选择">&times;</button>
        </div>
        <div id="asset-picker-grid" class="asset-picker-grid"></div>
      </div>
    </dialog>

    <script>
      const createWorkspace = document.querySelector('.create-workspace');
      const centerPanel = document.querySelector('.create-empty-area');
      const assetSplitter = document.querySelector('.asset-splitter');
      const agentSplitter = document.querySelector('.agent-splitter');
      const centerSplitter = document.querySelector('.center-splitter');
      let activePanel = null;
      let startPosition = 0;
      let startWidth = 0;

      function startResize(panel, event) {
        activePanel = panel;
        startPosition = panel === 'center' ? event.clientY : event.clientX;
        const property = panel === 'asset' ? '--asset-width' : panel === 'agent' ? '--agent-width' : '--device-height';
        const target = panel === 'center' ? centerPanel : createWorkspace;
        startWidth = parseFloat(getComputedStyle(target).getPropertyValue(property));
        document.querySelector(`.${panel}-splitter`).classList.add('dragging');
        createWorkspace.classList.add('is-resizing');
        event.preventDefault();
      }

      assetSplitter.addEventListener('pointerdown', event => startResize('asset', event));
      agentSplitter.addEventListener('pointerdown', event => startResize('agent', event));
      centerSplitter.addEventListener('pointerdown', event => startResize('center', event));

      document.addEventListener('pointermove', event => {
        if (!activePanel) return;
        const currentPosition = activePanel === 'center' ? event.clientY : event.clientX;
        const delta = currentPosition - startPosition;
        const nextSize = activePanel === 'asset' ? startWidth + delta : startWidth - delta;
        const limits = activePanel === 'center' ? [120, 360] : activePanel === 'agent' ? [220, 460] : [180, 460];
        const property = activePanel === 'asset' ? '--asset-width' : activePanel === 'agent' ? '--agent-width' : '--device-height';
        const target = activePanel === 'center' ? centerPanel : createWorkspace;
        target.style.setProperty(property, `${Math.min(limits[1], Math.max(limits[0], nextSize))}px`);
      });

      document.addEventListener('pointerup', () => {
        if (!activePanel) return;
        document.querySelector(`.${activePanel}-splitter`).classList.remove('dragging');
        activePanel = null;
        createWorkspace.classList.remove('is-resizing');
      });

      const agentMenu = document.getElementById('agent-menu');
      const conversationListScreen = document.getElementById('conversation-list-screen');
      const chatScreen = document.getElementById('chat-screen');
      const conversationListTitle = document.getElementById('conversation-list-title');
      const chatTitle = document.getElementById('chat-title');
      const chatInput = document.querySelector('.chat-input');
      const chatDrafts = new Map();
      let selectedAgent = '';
      let activeConversationKey = '';
      let conversationCounter = 0;

      function showAgentScreen(screen) {
        agentMenu.hidden = screen !== 'menu';
        conversationListScreen.hidden = screen !== 'list';
        chatScreen.hidden = screen !== 'chat';
      }

      function openConversation(title, conversationKey) {
        activeConversationKey = conversationKey || `${selectedAgent}:conversation:${++conversationCounter}`;
        chatTitle.textContent = `${selectedAgent} · ${title}`;
        chatInput.value = chatDrafts.get(activeConversationKey) || '';
        showAgentScreen('chat');
      }

      document.querySelectorAll('.agent-option').forEach(option => {
        option.addEventListener('click', () => {
          selectedAgent = option.dataset.agent;
          conversationListTitle.textContent = `${selectedAgent} · 对话列表`;
          showAgentScreen('list');
        });
      });

      document.getElementById('conversation-list-back').addEventListener('click', () => showAgentScreen('menu'));
      document.getElementById('new-conversation-button').addEventListener('click', () => openConversation('新建对话'));
      document.getElementById('chat-back-button').addEventListener('click', () => showAgentScreen('list'));
      chatInput.addEventListener('input', () => {
        if (activeConversationKey) chatDrafts.set(activeConversationKey, chatInput.value);
      });

      document.querySelector('.conversation-list').addEventListener('click', event => {
        const conversation = event.target.closest('[data-conversation]');
        if (conversation) openConversation(conversation.dataset.conversation, conversation.dataset.conversationKey);
      });
    </script>

    <script>
      const assetApiBase = window.location.protocol === 'file:' ? 'http://127.0.0.1:8010' : '';
      const assetUid = localStorage.getItem('boldmaker_uid') || localStorage.getItem('boldmaker_account') || 'test';
      const assetStorageKey = `boldmaker_create_assets_${assetUid}`;
      const assetGrid = document.getElementById('asset-local-list');
      const assetPicker = document.getElementById('asset-picker');
      const assetPickerGrid = document.getElementById('asset-picker-grid');
      const previewPanel = document.querySelector('.preview-panel');
      const previewMedia = document.getElementById('preview-media');
      const previewToolbar = document.getElementById('preview-toolbar');
      const previewZoomValue = document.getElementById('preview-zoom-value');
      const contentUrlCache = new Map();
      let localResources = [];
      let selectedAssetIds = loadSelectedAssets();
      let previewZoom = 1;
      let previewMediaElement = null;
      let previewPanX = 0;
      let previewPanY = 0;
      let previewDragState = null;

      function assetHeaders(extra = {}) {
        return { 'X-User-Id': assetUid, ...extra };
      }

      function loadSelectedAssets() {
        try {
          const parsed = JSON.parse(localStorage.getItem(assetStorageKey) || '[]');
          return Array.isArray(parsed) ? parsed : [];
        } catch (_) {
          return [];
        }
      }

      function saveSelectedAssets() {
        localStorage.setItem(assetStorageKey, JSON.stringify(selectedAssetIds));
      }

      async function assetResponseError(response) {
        let message = `操作失败（${response.status}）`;
        try {
          const body = await response.json();
          if (body.detail) message = body.detail;
        } catch (_) {
          // Keep the status message when the server response is not JSON.
        }
        return message;
      }

      async function getContentUrl(item) {
        if (contentUrlCache.has(item.id)) return contentUrlCache.get(item.id);
        const response = await fetch(`${assetApiBase}/api/resources/${item.id}/content`, { headers: assetHeaders() });
        if (!response.ok) throw new Error(await assetResponseError(response));
        const url = URL.createObjectURL(await response.blob());
        contentUrlCache.set(item.id, url);
        return url;
      }

      function placeholderElement(text) {
        const box = document.createElement('div');
        box.className = 'preview-placeholder';
        if (text) {
          box.textContent = text;
          return box;
        }
        const mark = document.createElement('span');
        mark.className = 'play-mark';
        mark.textContent = '▶';
        const label = document.createElement('span');
        label.textContent = '等待视频或图片素材';
        box.append(mark, label);
        return box;
      }

      function renderAssetList() {
        assetGrid.replaceChildren();
        const items = selectedAssetIds
          .map(id => localResources.find(resource => resource.id === id))
          .filter(Boolean);
        if (items.length === 0) {
          const empty = document.createElement('p');
          empty.className = 'asset-empty';
          empty.innerHTML = '暂无素材<br />点击右上角 + 从本地仓库导入。';
          assetGrid.append(empty);
          return;
        }
        items.forEach(item => assetGrid.append(createAssetItem(item)));
      }

      function createAssetThumb(item) {
        const thumb = document.createElement('span');
        thumb.className = 'asset-thumb';
        if (item.kind === 'video') {
          thumb.classList.add('asset-thumb-video');
          thumb.textContent = '▶';
          return thumb;
        }
        const image = document.createElement('img');
        image.alt = item.original_name;
        thumb.append(image);
        getContentUrl(item).then(url => { image.src = url; }).catch(() => {});
        return thumb;
      }

      function createAssetItem(item) {
        const button = document.createElement('button');
        button.className = 'asset-item';
        button.type = 'button';
        button.dataset.id = item.id;
        button.title = item.original_name;

        const label = document.createElement('span');
        label.className = 'asset-label';
        label.textContent = item.original_name;

        const remove = document.createElement('span');
        remove.className = 'asset-remove';
        remove.textContent = '×';
        remove.title = '从素材库移除';
        remove.addEventListener('click', event => {
          event.stopPropagation();
          selectedAssetIds = selectedAssetIds.filter(id => id !== item.id);
          saveSelectedAssets();
          renderAssetList();
        });

        button.append(createAssetThumb(item), label, remove);
        button.addEventListener('click', () => showAssetPreview(item));
        return button;
      }

      async function showAssetPreview(item) {
        previewMedia.replaceChildren(placeholderElement('正在加载素材…'));
        assetGrid.querySelectorAll('.asset-item').forEach(element => {
          element.classList.toggle('active', element.dataset.id === item.id);
        });
        try {
          const url = await getContentUrl(item);
          const media = document.createElement(item.kind === 'video' ? 'video' : 'img');
          media.className = 'preview-media-element';
          media.src = url;
          if (item.kind === 'video') {
            media.controls = true;
            media.autoplay = true;
            media.playsInline = true;
          } else {
            media.alt = item.original_name;
            media.draggable = false;
          }
          previewMediaElement = media;
          previewZoom = 1;
          previewPanX = 0;
          previewPanY = 0;
          applyPreviewZoom();
          previewMedia.replaceChildren(media);
          previewToolbar.hidden = false;
        } catch (error) {
          previewMedia.replaceChildren(placeholderElement(error.message));
          previewToolbar.hidden = true;
        }
      }

      function applyPreviewZoom() {
        if (previewMediaElement) {
          previewMediaElement.style.transform = `translate(${previewPanX}px, ${previewPanY}px) scale(${previewZoom})`;
        }
        previewZoomValue.textContent = `${Math.round(previewZoom * 100)}%`;
      }

      function closePreview() {
        previewMediaElement = null;
        previewZoom = 1;
        previewPanX = 0;
        previewPanY = 0;
        previewDragState = null;
        previewPanel.classList.remove('is-dragging');
        previewToolbar.hidden = true;
        previewMedia.replaceChildren(placeholderElement());
        assetGrid.querySelectorAll('.asset-item').forEach(element => element.classList.remove('active'));
      }

      async function loadLocalResources() {
        const response = await fetch(`${assetApiBase}/api/resources`, { headers: assetHeaders() });
        if (!response.ok) throw new Error(await assetResponseError(response));
        localResources = (await response.json()).items;
        selectedAssetIds = selectedAssetIds.filter(id => localResources.some(resource => resource.id === id));
        saveSelectedAssets();
        renderAssetList();
      }

      async function openAssetPicker() {
        if (!assetPicker.open) assetPicker.showModal();
        const loading = document.createElement('p');
        loading.className = 'asset-picker-empty';
        loading.textContent = '正在加载本地素材…';
        assetPickerGrid.replaceChildren(loading);
        try {
          await loadLocalResources();
          renderAssetPicker();
        } catch (error) {
          loading.textContent = error.message;
          loading.className = 'asset-picker-error';
        }
      }

      function renderAssetPicker() {
        assetPickerGrid.replaceChildren();
        if (localResources.length === 0) {
          const empty = document.createElement('p');
          empty.className = 'asset-picker-empty';
          empty.textContent = '本地仓库暂无图片或视频，请先在仓库页面上传。';
          assetPickerGrid.append(empty);
          return;
        }
        localResources.forEach(item => assetPickerGrid.append(createPickerItem(item)));
      }

      function createPickerItem(item) {
        const button = document.createElement('button');
        button.className = 'asset-picker-item';
        button.type = 'button';
        button.dataset.id = item.id;
        if (selectedAssetIds.includes(item.id)) button.classList.add('selected');

        const thumb = document.createElement('div');
        thumb.className = 'asset-picker-thumb';
        if (item.kind === 'video') {
          thumb.textContent = '▶';
        } else {
          const image = document.createElement('img');
          image.alt = item.original_name;
          thumb.append(image);
          getContentUrl(item).then(url => { image.src = url; }).catch(() => {});
        }

        const name = document.createElement('span');
        name.className = 'asset-picker-name';
        name.textContent = item.original_name;

        button.append(thumb, name);
        button.addEventListener('click', () => {
          if (selectedAssetIds.includes(item.id)) {
            selectedAssetIds = selectedAssetIds.filter(id => id !== item.id);
            button.classList.remove('selected');
          } else {
            selectedAssetIds.push(item.id);
            button.classList.add('selected');
          }
          saveSelectedAssets();
          renderAssetList();
        });
        return button;
      }

      document.getElementById('asset-add-button').addEventListener('click', openAssetPicker);
      document.getElementById('asset-picker-close').addEventListener('click', () => assetPicker.close());
      document.getElementById('preview-zoom-in').addEventListener('click', () => {
        previewZoom = Math.min(4, previewZoom + 0.25);
        applyPreviewZoom();
      });
      document.getElementById('preview-zoom-out').addEventListener('click', () => {
        previewZoom = Math.max(0.25, previewZoom - 0.25);
        applyPreviewZoom();
      });
      document.getElementById('preview-close').addEventListener('click', closePreview);

      previewPanel.addEventListener('pointerdown', event => {
        if (!previewMediaElement || event.button !== 0) return;
        if (event.target.closest('.preview-toolbar')) return;
        if (previewMediaElement.tagName === 'VIDEO' && event.target === previewMediaElement) {
          if (event.offsetY > previewMediaElement.offsetHeight - 44) return;
        } else {
          event.preventDefault();
        }
        previewDragState = { x: event.clientX, y: event.clientY, panX: previewPanX, panY: previewPanY };
        previewPanel.classList.add('is-dragging');
      });

      window.addEventListener('pointermove', event => {
        if (!previewDragState) return;
        previewPanX = previewDragState.panX + (event.clientX - previewDragState.x);
        previewPanY = previewDragState.panY + (event.clientY - previewDragState.y);
        applyPreviewZoom();
      });

      window.addEventListener('pointerup', () => {
        if (!previewDragState) return;
        previewDragState = null;
        previewPanel.classList.remove('is-dragging');
      });

      renderAssetList();
      loadLocalResources().catch(error => {
        const failure = document.createElement('p');
        failure.className = 'asset-empty';
        failure.textContent = error.message;
        assetGrid.replaceChildren(failure);
      });
    </script>
  </body>
</html>
